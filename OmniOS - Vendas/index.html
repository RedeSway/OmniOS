<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Assistência, OmniOS">

    <link rel="stylesheet" href="../OmniOS%20-%20Ordens/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../comum.css">

    <title>OmniOS - Vendas</title>

    <link rel="icon" type="image/png" href="../OmniOS%20-%20Main/imagens/favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="../OmniOS%20-%20Main/imagens/favicon/favicon.svg">
    <link rel="shortcut icon" href="../OmniOS%20-%20Main/imagens/favicon/favicon.ico">
</head>

<body data-acesso="vendas">

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icone">
                <img src="../OmniOS%20-%20Main/imagens/logo.jpeg" alt="Logo OmniOS">
            </div>
            <h2>OmniOS</h2>
        </div>

        <nav class="menu" aria-label="Menu principal">
            <a href="../OmniOS%20-%20Main/index.html" class="menu-item"><span aria-hidden="true">⌂</span>Visão Geral</a>
            <a href="../OmniOS%20-%20Ordens/index.html" class="menu-item" data-permissao="ordens"><span aria-hidden="true">☷</span>Ordens de Serviço</a>
            <a href="../OmniOS%20-%20Vendas/index.html" class="menu-item ativo" data-permissao="vendas"><span aria-hidden="true">$</span>Vendas</a>
        </nav>

        <div class="sidebar-rodape">
        <div class="barra-perfis">
            <div class="perfil">
                <img class="perfil-logo" src="../OmniOS%20-%20Main/imagens/perfil_1.png" alt="Perfil">
                <div class="perfil-info">
                    <span class="nomeperfil"></span>
                    <p class="funcao-perfil"></p>
                </div>
            </div>
            <hr class="linha">
            <a href="../OmniOS%20-%20Configuracoes/index.html" class="menu-item"><span aria-hidden="true">⚙</span>Configurações</a>
        </div>
        </div>
    </aside>

    <div class="pagina">
        <header class="topo">
            <div>
                <p class="caminho">Serviços / Vendas</p>
                <h1>Vendas</h1>
            </div>
            <div class="data">📅 Hoje</div>
        </header>

        <main>
            <section class="conteudo">
                <div class="barra-acoes">
                    <p>Consulte e acompanhe as vendas registradas.</p>
                    <a class="botao" href="../OmniOS%20-%20Nova%20Venda/index.html">+ Nova venda</a>
                </div>

                <div class="barra-filtros">
                    <div class="search">
                        <span class="search-icone">⌕</span>
                        <input id="busca-venda" type="text" placeholder="Buscar venda, cliente, item...">
                    </div>

                    <div class="filtro_finalizado">
                        <select id="filtro-status">
                            <option value="Todos">Status: Todos</option>
                            <option value="Concluída">Status: Concluída</option>
                            <option value="Cancelada">Status: Cancelada</option>
                        </select>
                    </div>

                    <div class="filtro_prioridade">
                        <select id="filtro-periodo">
                            <option value="Todos">Período: Todos</option>
                            <option value="Hoje">Período: Hoje</option>
                            <option value="Mes">Período: Este mês</option>
                        </select>
                    </div>

                    <button type="button" class="btn-exportar" id="btn-exportar" data-permissao="exportar">
                        ⭳ Exportar Backup
                    </button>
                </div>

                <div class="painel ordens vendas-painel">
                    <table class="tabela-vendas">
                        <thead>
                            <tr>
                                <th>Número</th>
                                <th>Cliente</th>
                                <th>Item / Modelo</th>
                                <th>Responsável</th>
                                <th>Status</th>
                                <th>Data</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody id="lista-vendas">
                            <tr class="tabela-vazia">
                                <td colspan="7">Nenhuma venda cadastrada.</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="paginacao">
                        <span id="contagem-vendas"></span>
                        <div id="paginas-vendas" class="paginas"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../comum.js"></script>
    <script src="../autenticacao.js"></script>
    <script src="../dados.js"></script>
    <script src="script.js"></script>
</body>

</html>
