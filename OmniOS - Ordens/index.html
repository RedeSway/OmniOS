<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Assistência, OmniOS">

    <link rel="stylesheet" href="style.css">

    <title>OmniOS</title>

    <link rel="icon" type="image/png" href="imagens/favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="imagens/favicon/favicon.svg">
    <link rel="shortcut icon" href="imagens/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon/apple-touch-icon.png">

    <meta name="apple-mobile-web-app-title" content="OmniOS">
</head>

<body>

    <aside class="sidebar">

        <!-- LOGO -->
        <div class="logo">

            <div class="logo-icone">
                <img src="imagens/logo.jpeg" alt="Logo OmniOS">
            </div>

            <h2>OmniOS</h2>

        </div>


        <!-- MENU -->
        <nav class="menu">

            <a href="../OmniOS%20-%20Main/index.html" class="menu-item">
                <span>⌂</span>
                Visão Geral
            </a>

            <a href="../OmniOS%20-%20Ordens/index.html" class="menu-item ativo">
                <span>☷</span>
                Ordens de Serviço
            </a>

            <a href="../OmniOS%20-%20Main/index.html#nova-os" id="btn-nova-os" class="menu-item">
                <span>╋</span>
                Nova OS
            </a>

            <a href="#" id="btn-nova-venda" class="menu-item">
                <span>$$$</span>
                Nova Venda
            </a>

        </nav>


        <!-- PERFIS -->
        <div class="barra-perfis">

            <div class="perfil">

                <img
                    class="perfil-logo"
                    src="imagens/perfil_1.png"
                    alt="Daniel Gonçalves"
                >

                <div class="perfil-info">

                    <span class="nomeperfil">
                        Daniel
                    </span>

                    <p class="funcao-perfil">
                        Administrador
                    </p>

                </div>

            </div>


            <!-- LINHA SEPARADORA -->
            <hr class="linha">

        </div>

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <div class="pagina">

        <header class="topo">

            <div>

                <p class="caminho">
                    Serviços / Ordens
                </p>

                <h1>Ordens de serviço</h1>

            </div>

            <div class="data">
                📅 Hoje
            </div>

        </header>


        <main>

            <!-- CONTEÚDO -->
            <section class="conteudo">

                <div class="barra-filtros">

                    <div class="search">

                        <span class="search-icone">⌕</span>

                        <input
                            type="text"
                            placeholder="Buscar OS, cliente, aparelho..."
                        >

                    </div>

                    <!--SELEÇÃO FILTRO -->
                    <div class="filtro_dispositivo">
                        <select>
                            <option value="Todos">Dispositivo: Todos</option>
                            <option value="Celular">Dispositivo: Celular</option>
                            <option value="PC">Dispositivo: PC</option>
                            <option value="Notebook">Dispositivo: Notebook</option>
                        </select>

                    </div>


                    <div class="filtro_finalizado">
                        <select>
                            <option value="Todos">Status: Todos</option>
                            <option value="Em aberto">Status: Em aberto</option>
                            <option value="Em andamento">Status: Em andamento</option>
                            <option value="Finalizado">Status: Finalizado</option>
                            <option value="Cancelado">Status: Cancelado</option>
                        </select>

                    </div>

                </div>


                <!-- ORDENS -->
                <div class="painel ordens">

                    <div class="painel-cabecalho">

                        <h2>Ordens de Serviço Recentes</h2>

                        <a href="#">Ver todas</a>

                    </div>


                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Aparelho</th>
                                <th>Status</th>
                                <th>Data</th>
                                <th>Valor</th>
                            </tr>

                        </thead>


                        <tbody>

                            <tr class="tabela-vazia">

                                <td colspan="6">
                                    Nenhuma ordem de serviço cadastrada.
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
