<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Assistência, OmniOS">

    <link rel="stylesheet" href="style.css">

    <title>OmniOS</title>

    <link rel="icon" type="image/png" href="imagens/favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="imagens/favicon/favicon.svg">
    <link rel="shortcut icon" href="imagens/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon/apple-touch-icon.png">

    <meta name="apple-mobile-web-app-title" content="OmniOS">
    <link rel="stylesheet" href="../comum.css">
</head>

<body data-acesso="ordens">

    <aside class="sidebar">

        <!-- LOGO -->
        <div class="logo">

            <div class="logo-icone">
                <img src="imagens/logo.jpeg" alt="Logo OmniOS">
            </div>

            <h2>OmniOS</h2>

        </div>


        <!-- MENU -->
        <nav class="menu" aria-label="Menu principal">
<a href="../OmniOS%20-%20Main/index.html" class="menu-item"><span aria-hidden="true">⌂</span>Visão Geral</a>
<a href="../OmniOS%20-%20Ordens/index.html" class="menu-item ativo" data-permissao="ordens"><span aria-hidden="true">☷</span>Ordens de Serviço</a>
<a href="../OmniOS%20-%20Vendas/index.html" class="menu-item" data-permissao="vendas"><span aria-hidden="true">$</span>Vendas</a>
</nav>


        <!-- RODAPÉ DO SIDEBAR -->
        <div class="sidebar-rodape">
        <div class="barra-perfis">

            <div class="perfil">

                <img
                    class="perfil-logo"
                    src="../OmniOS%20-%20Main/imagens/perfil_1.png"
                    alt="Daniel Gonçalves"
                >

                <div class="perfil-info">

                    <span class="nomeperfil">
                        Daniel
                    </span>

                    <p class="funcao-perfil">
                        Administrador
                    </p>

                </div>

            </div>


            
            <!-- LINHA SEPARADORA -->
            <hr class="linha">
<a href="../OmniOS%20-%20Configuracoes/index.html" class="menu-item"><span aria-hidden="true">⚙</span>Configurações</a>

        </div>
        </div>
    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <div class="pagina">

        <header class="topo">

            <div>

                <p class="caminho">
                    Serviços / Ordens
                </p>

                <h1>Ordens de serviço</h1>

            </div>

            <div class="data">
                📅 Hoje
            </div>

        </header>


        <main>

            <!-- CONTEÚDO -->
            <section class="conteudo">

                <div class="barra-acoes"><p>Consulte e acompanhe as ordens de serviço.</p><a class="botao" href="../OmniOS%20-%20Nova%20Ordem/index.html">+ Nova OS</a></div>

                <div class="barra-filtros">

                    <div class="search">

                        <span class="search-icone">⌕</span>

                        <input
                            type="text"
                            placeholder="Buscar OS, cliente, aparelho..."
                        >

                    </div>

                    <!--SELEÇÃO FILTRO -->
                    <div class="filtro_finalizado">
                        <select>
                            <option value="Todos">Status: Todos</option>
                            <option value="Aberto">Status: Aberto</option>
                            <option value="Em Andamento">Status: Em Andamento</option>
                            <option value="Concluído">Status: Concluído</option>
                            <option value="Cancelado">Status: Cancelado</option>
                        </select>

                    </div>


                    <div class="filtro_prioridade">
                        <select>
                            <option value="Todas">Prioridade: Todas</option>
                            <option value="Baixa">Prioridade: Baixa</option>
                            <option value="Média">Prioridade: Média</option>
                            <option value="Alta">Prioridade: Alta</option>
                            <option value="Urgente">Prioridade: Urgente</option>
                        </select>

                    </div>

                    <button type="button" class="btn-exportar" id="btn-exportar" data-permissao="exportar">
                        ⭳ Exportar Backup
                    </button>

                </div>


                <!-- ORDENS -->
                <div class="painel ordens">

                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Aparelho</th>
                                <th>Problema</th>
                                <th>Técnico</th>
                                <th>Prioridade</th>
                                <th>Status</th>
                                <th>Data</th>
                                <th>Valor</th>
                            </tr>

                        </thead>


                        <tbody>

                            <tr class="tabela-vazia">

                                <td colspan="9">
                                    Nenhuma ordem de serviço cadastrada.
                                </td>

                            </tr>

                        </tbody>

                    </table>

                    <!-- RODAPÉ DA TABELA -->
                    <div class="paginacao">

                        <span class="contagem"></span>

                        <div class="paginas"></div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="../comum.js"></script>
<script src="../autenticacao.js"></script>
<script src="../dados.js"></script>
<script src="script.js"></script>

</body>

</html>
