<main class="area-pagina"><section class="bloco-form"><h2 id="titulo-form-perfil">Adicionar perfil</h2><p class="texto-ajuda">Administradores têm acesso a todas as funções. Nos outros cargos, escolha as permissões abaixo.</p><form id="form-perfil"><div class="grade-form"><label>Nome<input id="perfil-nome" required maxlength="100" autocomplete="name"></label><label>E-mail<input id="perfil-email" type="email" required maxlength="150" autocomplete="email"></label><label>Senha<input id="perfil-senha" type="password" minlength="8" autocomplete="new-password" required><small id="ajuda-senha">Mínimo de 8 caracteres.</small></label><label>Cargo<select id="perfil-cargo"><option>Atendente</option><option>Técnico</option><option>Administrador</option></select></label></div><label class="foto-perfil-campo">Foto do perfil<div class="foto-perfil-editor"><img id="foto-perfil-preview" class="foto-perfil-preview" src="../OmniOS%20-%20Main/imagens/perfil_1.png" alt="Pré-visualização da foto"><input id="perfil-foto" type="file" accept="image/png,image/jpeg,image/webp"><span class="foto-perfil-ajuda">Opcional. A imagem atual será usada como placeholder.</span></div></label><fieldset><legend>Permissões</legend><div id="permissoes-perfil" class="grade-permissoes"></div></fieldset><label class="opcao"><input id="perfil-ativo" type="checkbox" checked>Perfil ativo</label><div class="barra-acoes"><button class="botao" type="submit">Salvar perfil</button><button class="botao secundario" id="cancelar-perfil" type="button">Limpar</button></div><p id="mensagem-perfil" role="status" aria-live="polite"></p></form></section><section class="bloco-form"><h2>Perfis cadastrados</h2><div class="tabela-rolagem"><table class="tabela-dados"><thead><tr><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="lista-perfis"></tbody></table></div></section></main></div>
