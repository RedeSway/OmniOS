user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# Use o descritor de stderr diretamente: reabrir /dev/stderr pode falhar
# no Cloudflare Containers. A opção -e stderr também cobre a inicialização.
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # O Worker já registra as requisições. Evite o link de access.log para
    # /dev/stdout, que também depende da reabertura de um descritor.
    access_log off;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
